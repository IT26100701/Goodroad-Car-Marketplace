server.port=${PORT:5000}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
# Set SESSION_COOKIE_SECURE=true when served over HTTPS.
# With plain http://localhost a Secure cookie is dropped by the browser and login silently fails.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

app.data-dir=${APP_DATA_DIR:./data}
app.seed-sample-data=${APP_SEED_SAMPLE_DATA:true}
app.sample-data-dir=${APP_SAMPLE_DATA_DIR:./sample-data}
app.admin.setup-token=${APP_ADMIN_SETUP_TOKEN:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

spring.jackson.serialization.write-dates-as-timestamps=false
